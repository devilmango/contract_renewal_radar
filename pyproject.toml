[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-renewal-radar"
version = "0.1.0"
description = "Self-hosted contract date extraction, review, and renewal reminders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=4.2,<6.0",
  "uvicorn[standard]>=0.27,<1.0",
  "PyJWT[crypto]>=2.8,<3.0",
]

[project.optional-dependencies]
llm = ["openai>=1.55,<3.0"]
llm-anthropic = ["anthropic>=0.75,<2.0"]
llm-google = ["google-genai>=1.0,<2.0"]
llm-mistral = ["mistralai>=1.9,<3.0"]
llm-cohere = ["cohere>=5.11,<6.0"]
llm-xai = ["openai>=1.55,<3.0"]
llm-all = [
  "openai>=1.55,<3.0",
  "anthropic>=0.75,<2.0",
  "google-genai>=1.0,<2.0",
  "mistralai>=1.9,<3.0",
  "cohere>=5.11,<6.0",
]
ocr = ["pymupdf>=1.24,<2.0", "pytesseract>=0.3.10,<1.0"]
test = ["pytest>=8.0,<9.0"]
database = ["psycopg[binary]>=3.2,<4.0"]

[project.scripts]
renewal-radar = "renewal_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
