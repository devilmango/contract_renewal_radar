name: Extraction evaluation

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  rules-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run workflow and storage tests
        run: pytest -q
      - name: Evaluate redacted fixtures with deterministic baseline
        run: renewal-radar evaluate --provider rules --min-exact-accuracy 0.70 --min-field-accuracy 0.70 --min-evidence-support 0.90

  postgres-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar-ci-password
          POSTGRES_DB: renewal_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d renewal_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://radar:radar-ci-password@localhost:5432/renewal_radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test,database]'
      - name: Verify PostgreSQL schema, feedback, delivery history, and job claims
        run: pytest -q tests/test_postgres_store.py
