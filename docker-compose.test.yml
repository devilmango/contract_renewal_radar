services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar-test-password
      POSTGRES_DB: renewal_radar_test
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d renewal_radar_test"]
      interval: 3s
      timeout: 3s
      retries: 20
